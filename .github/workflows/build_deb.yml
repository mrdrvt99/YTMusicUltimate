name: Build YTMusicUltimate DEBs Only

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tweak DEBs
    runs-on: xcode-27
    env:
      SDK_VERSION: '26.5'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Setup Theos (latest commit)
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Cache iOS SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: ios_sdk_${{ env.SDK_VERSION }}

      - name: Download iOS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          sdk_repo="$RUNNER_TEMP/iOS-SDKs"
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git "$sdk_repo"
          cd "$sdk_repo"
          git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv "iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"
          rm -rf "$sdk_repo"

      - name: Build Rootful Tweak
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1
          mkdir -p ../output/rootful
          mv packages/*.deb ../output/rootful/

      - name: Build Rootless Tweak
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 ROOTLESS=1
          mkdir -p ../output/rootless
          mv packages/*.deb ../output/rootless/

      - name: Build Sideloading Tweak
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1
          mkdir -p ../output/sideload
          mv packages/*.deb ../output/sideload/

      - name: Upload .deb Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: YTMusicUltimate-Compiled-DEBs
          path: output/**/*.deb
