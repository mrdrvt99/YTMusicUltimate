name: Build and Release YTMusicUltimate

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

      rymd:
        description: "Integrate Return YouTubeMusic Dislikes"
        type: boolean
        required: true
        default: true

      ytmabc:
        description: "Integrate YTMABConfig"
        type: boolean
        required: true
        default: true

      youmusicpip:
        description: "Integrate YouMusicPiP"
        type: boolean
        required: true
        default: false

      volumeboostyt:
        description: "Integrate VolumeBoostYT"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SDK_VERSION: '26.5'

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,rymd,ytmabc,youmusicpip,volumeboostyt

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: main
          submodules: recursive
          persist-credentials: false

      - name: Download and Validate IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          download() {
            rm -f "$2"
            if wget --quiet --no-verbose --tries=3 --waitretry=2 -O "$2" "$1"; then
              return 0
            fi
            echo "::warning::wget failed for $2, retrying with curl"
            rm -f "$2"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 -o "$2" "$1"
          }
          download "$IPA_URL" ytm.ipa
          file_type=$(file --mime-type -b ytm.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Music Version
        run: |
          plist_entry="$(unzip -Z1 ytm.ipa | grep -m1 -E '^Payload/[^/]+\.app/Info\.plist$' || true)"
          if [ -z "$plist_entry" ]; then
            echo "::error::Could not find Payload/<app>.app/Info.plist inside the IPA"
            exit 1
          fi
          plist_dir="$RUNNER_TEMP/ytmplist"
          mkdir -p "$plist_dir"
          unzip -q -j -o ytm.ipa "$plist_entry" -d "$plist_dir"
          ytm_version="$(plutil -extract CFBundleVersion raw -o - "$plist_dir/Info.plist" | tr -d '\r\n' | tr -c 'A-Za-z0-9._+~-' '_')"
          rm -rf "$plist_dir"
          if [ -z "$ytm_version" ]; then
            echo "::error::Could not read CFBundleVersion from the IPA's Info.plist"
            exit 1
          fi
          echo "YTM_VERSION=$ytm_version" >> "$GITHUB_ENV"

      - name: Get Tweak Version
        run: |
          ytmu_version="$(grep '^PACKAGE_VERSION' main/Makefile | awk -F' = ' '{print $2}' | tr -d '\r\n' | tr -c 'A-Za-z0-9._+~-' '_')"
          if [ -z "$ytmu_version" ]; then
            echo "::warning::Could not read PACKAGE_VERSION from main/Makefile; using 'unknown' in the file name"
            ytmu_version="unknown"
          fi
          echo "YTMU_VERSION=$ytmu_version" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          brew uninstall --ignore-dependencies bicep || true
          brew untap aws/tap azure/bicep || true
          brew install make ldid

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Setup Theos (latest commit)
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Cache iOS SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: ios_sdk_${{ env.SDK_VERSION }}

      - name: Download iOS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          sdk_repo="$RUNNER_TEMP/iOS-SDKs"
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git "$sdk_repo"
          cd "$sdk_repo"
          git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv "iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          rm -rf "$sdk_repo"

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Clone YouTubeHeader
        run: |
          rm -rf "$THEOS/include/YouTubeHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"

      - name: Clone PSHeader
        run: |
          rm -rf "$THEOS/include/PSHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"

      - name: Clone YouTubeMusicHeader
        run: |
          rm -rf "$THEOS/include/YouTubeMusicHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeMusicHeader.git "$THEOS/include/YouTubeMusicHeader"

      - name: Clone Return YouTube Dislikes
        if: ${{ inputs.rymd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone YouPiP
        if: ${{ inputs.youmusicpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git

      - name: Clone and Build Return YouTubeMusic Dislikes
        if: ${{ inputs.rymd }}
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Music-Dislikes.git
          cd Return-YouTube-Music-Dislikes && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/rymd.deb

      - name: Clone and Build YTMABConfig
        if: ${{ inputs.ytmabc }}
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTMABConfig.git
          cd YTMABConfig && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytmabc.deb

      - name: Clone and Build YouMusicPiP
        if: ${{ inputs.youmusicpip }}
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouMusicPiP.git
          cd YouMusicPiP && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youmusicpip.deb

      - name: Clone and Build VolumeBoostYT
        if: ${{ inputs.volumeboostyt }}
        run: |
          git clone --quiet --depth=1 https://github.com/irum0320/VolumeBoostYT.git
          cd VolumeBoostYT && make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ${{ github.workspace }}/volumeboostyt.deb

      - name: Build Tweak for Sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOADING=1
          mv packages/*.deb ../ytmult.deb

      - name: Inject Tweak Into IPA
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          tweaks=("ytmult.deb")
          for f in rymd.deb ytmabc.deb youmusicpip.deb volumeboostyt.deb; do
            if [ -f "$f" ]; then
              tweaks+=("$f")
            fi
          done
          ipa_name="YTMusicUltimate_${YTM_VERSION}_${YTMU_VERSION}.ipa"
          cyan -i ytm.ipa -o "$ipa_name" -uwesf "${tweaks[@]}" -n "$DISPLAY_NAME" -b "$BUNDLE_ID"
          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: Create a Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytmu-ipa${{ github.run_number }}
          name: YTMusicUltimate_${{ env.YTM_VERSION }}_${{ env.YTMU_VERSION }}
          files: ${{ env.IPA_NAME }}
          draft: false
          fail_on_unmatched_files: true

      - name: Job Summary
        run: |
          {
            echo '### 🛠️ Build YTMusicUltimate IPA Complete!'
            echo
            echo '### 🚀 Draft Release'
            echo
            echo "Draft release has been created successfully! You can view your release here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
